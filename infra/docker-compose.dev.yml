# Docker Compose para desenvolvimento local (PostgreSQL + Redis)
# Uso: docker compose -f infra/docker-compose.dev.yml up -d
version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nebula
      POSTGRES_PASSWORD: nebula_dev
      POSTGRES_DB: nebula_finance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  postgres_data:
